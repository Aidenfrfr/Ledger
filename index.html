<title>Ledger – Offline Budget Tracker</title>
<style>
:root{--bg:#f1f2ef;--card:#f9faf8;--tx:#25302b;--mut:#6c7771;--bd:#dde1dc;--ac:#2f7d5b;--acs:#e3eee8;--red:#b4493f;--sh:0 1px 2px rgba(37,48,43,.04);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#131816;--card:#1b221f;--tx:#dde4e0;--mut:#8a9690;--bd:#2a332f;--ac:#5fb894;--acs:#1c2c25;--red:#e07a6f;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
nav{width:210px;padding:24px 16px;border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:700;font-size:18px;padding:0 10px 18px;display:flex;gap:8px;align-items:center}.logo i{width:22px;height:22px;border-radius:7px;background:var(--ac);display:inline-block}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:10px;color:var(--mut);font-weight:500;display:flex;gap:10px;align-items:center;transition:.15s}
nav button:hover{background:var(--acs)}nav button.on{background:var(--acs);color:var(--ac)}
main{flex:1;max-width:1100px;padding:28px 28px 90px;margin:0 auto;width:100%;min-width:0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:24px;margin:0;letter-spacing:-.02em}h3{margin:0 0 14px;font-size:15px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:var(--sh);min-width:0}
.lbl{color:var(--mut);font-size:13px}.big{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.pos{color:var(--ac)}.neg{color:var(--red)}
.btn{cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:10px;font:inherit;font-weight:500;transition:.15s}
.btn:hover{border-color:var(--ac)}.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}:root[data-theme=dark] .btn.p{color:#10201a}.btn.p:hover{filter:brightness(.93)}.btn.d{color:var(--red)}.btn.s{padding:4px 10px;font-size:13px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.tr{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd)}.tr:last-child{border:0}
.dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.grow{flex:1;min-width:0}.grow b,.grow span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .4s}
.bar.over i{background:var(--red)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}.seg button{all:unset;cursor:pointer;padding:7px 12px;color:var(--mut)}.seg button.on{background:var(--acs);color:var(--ac)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:16px;z-index:20}
.modal>div{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:400px;display:grid;gap:12px;border:1px solid var(--bd)}
label{font-size:13px;color:var(--mut);display:grid;gap:4px}
.empty{color:var(--mut);text-align:center;padding:26px 0}
svg text{fill:var(--mut);font-size:11px}
.ls{display:none}
@media(max-width:820px){input,select{font-size:16px}.g4{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}
nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;flex-direction:row;justify-content:space-around;background:var(--card);border-top:1px solid var(--bd);border-right:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav button{flex:1;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:10.5px;padding:6px 2px;text-align:center}.lf{display:none}.ls{display:inline}.logo{display:none}main{padding:18px 16px 90px}}
</style></head><body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div><div id="modal"></div>
<script>
try{const th=localStorage.getItem("ledger_theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
const DEF=[["Housing","#2f7d5b"],["Food","#c4913f"],["Transport","#5183b0"],["Utilities","#7f70b0"],["Health","#b56f8d"],["Fun","#42968f"],["Shopping","#bf7a50"],["Other","#8d9893"]].map(([name,color])=>({name,type:"expense",color})).concat([["Salary","#2f7d5b"],["Freelance","#5183b0"],["Other income","#8d9893"]].map(([name,color])=>({name,type:"income",color})));
let cats=DEF.map(c=>({...c})),subs=[];
const col=n=>(cats.find(c=>c.name===n)||{}).color||"#9aa6a0",names=t=>cats.filter(c=>c.type===t).map(c=>c.name);
const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let db=null,tx=[],budgets={},goals=[],view="dash",off=0,filt={q:"",t:"all"};
const mem={tx:[],goals:[],budgets:[]};
function openDB(){return new Promise(r=>{try{const q=indexedDB.open("ledger",2);q.onupgradeneeded=()=>{const d=q.result,mk=(n,k)=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:k})};mk("tx","id");mk("goals","id");mk("budgets","cat");mk("subs","id")};q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})}
const all=n=>new Promise(r=>{if(!db)return r([]);const q=db.transaction(n).objectStore(n).getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])});
const put=(n,v)=>{try{db&&db.transaction(n,"readwrite").objectStore(n).put(v)}catch(e){}};
const rm=(n,k)=>{try{db&&db.transaction(n,"readwrite").objectStore(n).delete(k)}catch(e){}};
const clr=n=>{try{db&&db.transaction(n,"readwrite").objectStore(n).clear()}catch(e){}};
const ym=d=>d.slice(0,7);
const mkey=o=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+o);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const mname=k=>new Date(k+"-15").toLocaleDateString("en-US",{month:"long",year:"numeric"});
const sum=(a,t)=>a.filter(x=>x.type===t).reduce((s,x)=>s+x.amount,0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const ICON={dash:"▦",tx:"⇄",bud:"◔",goal:"◎",subs:"↻",data:"⋯"};
function nav(){$("#nav").innerHTML='<div class="logo"><i></i>Ledger</div>'+[["dash","Dashboard","Home"],["tx","Transactions","Activity"],["bud","Budgets","Budgets"],["goal","Goals","Goals"],["subs","Subscriptions","Recurring"],["data","Data and Options","More"]].map(([k,l,s])=>`<button class="${view===k?"on":""}" data-act="view" data-v="${k}"><span>${ICON[k]}</span><span class="lf">${l}</span><span class="ls">${s}</span></button>`).join("")}
function monthBar(){const k=mkey(off);return `<div class="row"><button class="btn s" data-act="mo" data-d="-1" aria-label="Previous month">‹</button><b style="min-width:130px;text-align:center">${mname(k)}</b><button class="btn s" data-act="mo" data-d="1" ${off>=0?"disabled":""} aria-label="Next month">›</button></div>`}
function txRow(t,actions){const inc=t.type==="income",c=inc?"var(--ac)":col(t.cat);
return `<div class="tr"><div class="dot" style="background:${c}22;color:${c}">${esc(t.cat[0])}</div><div class="grow"><b>${esc(t.note||t.cat)}</b><span class="lbl">${esc(t.cat)} · ${new Date(t.date+"T12:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})}${t.sub?" · Subscription":""}</span></div><b class="${inc?"pos":""}">${inc?"+":"−"}${money(t.amount)}</b>${actions?`<button class="btn s" data-act="edit" data-id="${t.id}">Edit</button><button class="btn s d" data-act="ask" data-id="${t.id}">Delete</button>`:""}</div>`}
function donut(data){const tot=data.reduce((s,d)=>s+d[1],0);if(!tot)return'<div class="empty">No spending this month</div>';let a=-Math.PI/2,R=60,r=38,p="";
data.forEach(([c,v])=>{const b=a+v/tot*2*Math.PI,l=b-a>Math.PI?1:0;if(data.length===1){p+=`<circle cx="70" cy="70" r="${(R+r)/2}" fill="none" stroke="${col(c)}" stroke-width="${R-r}"/>`}else p+=`<path d="M${70+R*Math.cos(a)} ${70+R*Math.sin(a)}A${R} ${R} 0 ${l} 1 ${70+R*Math.cos(b)} ${70+R*Math.sin(b)}L${70+r*Math.cos(b)} ${70+r*Math.sin(b)}A${r} ${r} 0 ${l} 0 ${70+r*Math.cos(a)} ${70+r*Math.sin(a)}Z" fill="${col(c)}"/>`;a=b});
return `<div class="row" style="gap:20px;flex-wrap:nowrap"><svg width="140" height="140" viewBox="0 0 140 140" style="flex:none">${p}</svg><div class="grow">${data.map(([c,v])=>`<div class="row" style="justify-content:space-between;flex-wrap:nowrap;font-size:13px"><span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${col(c)};margin-right:7px"></i>${c}</span><span>${Math.round(v/tot*100)}% · ${money(v)}</span></div>`).join("")}</div></div>`}
function bars(){const ks=[5,4,3,2,1,0].map(i=>mkey(off-i)),d=ks.map(k=>{const m=tx.filter(t=>ym(t.date)===k);return[k,sum(m,"income"),sum(m,"expense")]}),mx=Math.max(1,...d.flatMap(x=>[x[1],x[2]]));

document.addEventListener("change",e=>{const t=e.target;if(t.dataset.act==="lim"){const v=parseFloat(t.value)||0,c=t.dataset.c;if(v>0)budgets[c]=v;else delete budgets[c];v>0?put("budgets",{cat:c,limit:v}):rm("budgets",c);render()}
if(t.id==="imp"&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);tx=d.tx||[];goals=d.goals||[];budgets=d.budgets||{};subs=d.subs||[];cats=d.cats||DEF.map(c=>({...c}));["tx","goals","budgets","subs"].forEach(clr);tx.forEach(x=>put("tx",x));goals.forEach(x=>put("goals",x));subs.forEach(x=>put("subs",x));Object.entries(budgets).forEach(([cat,limit])=>put("budgets",{cat,limit}));saveCats();render()}catch(_){alert("That file couldn’t be read.")}};r.readAsText(t.files[0])}});

const STEPS=[["Welcome to Ledger","Track income, expenses, budgets and savings goals. Everything is stored privately on this device. No account and no internet needed."],["Add transactions","Open Transactions and tap + Add transaction. Choose Expense or Income, then enter the amount, category and date. You can edit or delete any entry later."],["Set monthly budgets","In Budgets, enter a monthly limit for each category. The bar fills as you spend and turns red when you go over."],["Save toward goals","In Goals, create a goal with a target amount, then use Add funds as you save. Progress also appears on your Dashboard."],["Subscriptions and categories","Add recurring charges in Subscriptions by choosing a date and how often they repeat. They are added to Transactions automatically when due. Customize your categories in Data and Options."],["Read your dashboard","The Dashboard summarizes the selected month. Use the arrows to move between months. Export a backup from the Data and Options tab now and then, and replay this tutorial there any time."]];

function tour(i){const s=STEPS[i],last=i===STEPS.length-1;$("#modal").innerHTML=`<div class="modal"><div><div class="lbl">Step ${i+1} of ${STEPS.length}</div><h3 style="font-size:18px;margin:0">${s[0]}</h3><div style="color:var(--mut)">${s[1]}</div><div class="row" style="gap:6px">${STEPS.map((_,n)=>`<i style="width:${n===i?18:6}px;height:6px;border-radius:6px;background:${n===i?"var(--ac)":"var(--bd)"}"></i>`).join("")}</div><div class="row" style="justify-content:space-between"><button class="btn" data-act="tdone">${last?"Close":"Skip"}</button><div class="row">${i?`<button class="btn" data-act="tour" data-i="${i-1}">Back</button>`:""}<button class="btn p" data-act="${last?"tdone":"tour"}" data-i="${i+1}">${last?"Get started":"Next"}</button></div></div></div></div>`}
(async()=>{db=await openDB();tx=await all("tx");goals=await all("goals");(await all("budgets")).forEach(b=>{if(b.cat==="__tour")seen=true;else if(b.cat==="__cats"){if(Array.isArray(b.list)&&b.list.length)cats=b.list}else budgets[b.cat]=b.limit});subs=await all("subs");processSubs();try{if(localStorage.getItem("ledger_tour"))seen=true}catch(e){}try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}render();if(!seen)tour(0)})();
